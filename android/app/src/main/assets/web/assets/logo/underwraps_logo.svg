<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="50%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" rx="160" fill="url(#darkBg)" stroke="#30363d" stroke-width="4"/>

  <!-- Outer Energy Ring -->
  <circle cx="400" cy="400" r="320" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="12 16" opacity="0.4"/>
  <circle cx="400" cy="400" r="280" fill="none" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="6 10" opacity="0.3"/>

  <!-- Private Encrypted Shield Outer -->
  <path d="M400 140 L580 220 C580 440 400 620 400 620 C400 620 220 440 220 220 Z" 
        fill="url(#shieldGrad)" 
        opacity="0.15" 
        filter="url(#glow)"/>

  <!-- Private Shield Frame -->
  <path d="M400 160 L560 230 C560 430 400 590 400 590 C400 590 240 430 240 230 Z" 
        fill="#161b22" 
        stroke="url(#shieldGrad)" 
        stroke-width="12" 
        stroke-linejoin="round"/>

  <!-- Inner Cryptographic Vault Wrapping Waves (UnderWraps Ribbon) -->
  <path d="M290 320 Q400 260 510 320 Q400 380 290 320 Z" fill="#58a6ff" opacity="0.8"/>
  <path d="M290 380 Q400 320 510 380 Q400 440 290 380 Z" fill="#2ea043" opacity="0.8"/>
  <path d="M290 440 Q400 380 510 440 Q400 500 290 440 Z" fill="#a371f7" opacity="0.8"/>

  <!-- Private Central Eye / Key Enclave -->
  <circle cx="400" cy="380" r="28" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="400" cy="380" r="14" fill="#0d1117"/>
  <circle cx="400" cy="380" r="6" fill="#58a6ff"/>

  <!-- Typography -->
  <text x="400" y="690" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="44" font-weight="900" fill="#f0f6fc" letter-spacing="8">UNDERWRAPS</text>
  <text x="400" y="730" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="18" font-weight="600" fill="#8b949e" letter-spacing="4">PRIVATE E2EE MESSENGER</text>
</svg>
